<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype A — hand tracking</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e11; color: #dfe; font: 14px system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #wrap { position: relative; }
  canvas { display: block; }
  #view { width: 100%; height: 100%; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #msg { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; opacity: .8; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: #7bd04a; color: #0b1a05; cursor: pointer; }
</style>
<script type="importmap">{ "imports": { "@mediapipe/tasks-vision": "/node_modules/@mediapipe/tasks-vision/vision_bundle.mjs" } }</script>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="view"></canvas><canvas id="overlay"></canvas></div></div>
<div id="msg"><button id="go">Start camera</button></div>
<script type="module">
import { FrameSource, describeCameraError } from '/src/source.js';
import { HandTracker } from '/src/tracking.js';
import { DebugOverlay } from '/src/debug.js';

const q = new URLSearchParams(location.search);
const view = document.getElementById('view'), wrap = document.getElementById('wrap'), msg = document.getElementById('msg');
const g = view.getContext('2d');
const source = new FrameSource(), tracker = new HandTracker(), debug = new DebugOverlay(document.getElementById('overlay'));
tracker.mirror = q.get('mirror') !== '0';

function fit() {
  const a = source.aspect || 16 / 9, w = Math.min(innerWidth, innerHeight * a);
  wrap.style.width = w + 'px'; wrap.style.height = w / a + 'px';
}
addEventListener('resize', fit);

async function start() {
  msg.textContent = 'Starting…';
  try {
    await source.start({ sim: q.has('sim'), videoUrl: q.get('video') });
  } catch (e) { msg.textContent = describeCameraError(e); return; }
  view.width = source.width; view.height = source.height; debug.resize(source.width, source.height); fit();
  msg.textContent = 'Open your palm toward the camera · M mirror';
  source.onFrame = (result, t) => {
    const hand = tracker.update(result, t, source.aspect);
    g.save();
    if (tracker.mirror) { g.translate(view.width, 0); g.scale(-1, 1); }
    g.drawImage(source.frame, 0, 0); g.restore();
    debug.draw(hand, [['source', `${source.kind} ${source.width}x${source.height} @ ${source.fps.toFixed(0)} fps`], ['detect', `${source.detectMs.toFixed(1)} ms (${source.delegate})`]]);
    window.__hand = hand;
  };
}
addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'm') tracker.mirror = !tracker.mirror; });
document.getElementById('go').onclick = start;
if (q.has('sim') || q.has('video')) start();
</script>
</body>
</html>
